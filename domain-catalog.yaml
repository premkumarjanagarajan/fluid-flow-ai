# =============================================================================
# BetssonGroup Domain Catalog
# =============================================================================
# A curated registry of GitHub repositories organized by product domain.
# Used by product agents to navigate the BetssonGroup org (~3,200 repos)
# without requiring local clones or git submodules.
#
# Agents use this catalog + GitHub MCP tools (search_code, get_file_contents,
# list_issues, search_pull_requests) to query repos on-demand.
#
# Maintenance:
#   - Review quarterly or when org structure changes
#   - Run `org:BetssonGroup topic:<topic>` searches to discover new repos
#   - Repos listed under `key_repos` are the most important per domain
#
# Last updated: 2026-02-19
# =============================================================================

org: BetssonGroup

