# =============================================================================
# BetssonGroup Sportsbook Domain — Deep-Dive Catalog
# =============================================================================
# Breaks the top-level "sportsbook" domain (~243 repos) into functional
# sub-domains. Each sub-domain lists its key active repos, primary language,
# and purpose. Archived/deprecated repos are noted but not listed as key repos.
#
# Agents use this catalog + GitHub MCP tools (search_code, get_file_contents,
# list_issues, search_pull_requests) to query repos on-demand.
#
# Maintenance:
#   - Review quarterly or when team structure changes
#   - Run `org:BetssonGroup sb-<prefix>` searches to discover new repos
#   - Cross-reference with the top-level domain-catalog.yaml
#
# Last updated: 2026-03-16
# =============================================================================

org: BetssonGroup
parent_domain: sportsbook

sub_domains:

  # ---------------------------------------------------------------------------
  # COUPON PLACEMENT & SETTLEMENT (Bet placement, payout, settling)
  # ---------------------------------------------------------------------------
  coupon-placement:
    description: >
      Coupon lifecycle — bet/coupon placement, coupon management,
      bet settlement and payout, the bet-updater that persists state
      changes, and the wallet adapter that bridges bets to the wallet.
    name_patterns:
      - "sb-betting-coupon*"
      - "sb-betting-betpayout"
      - "sb-betting-wallet*"
      - "sb-betting-settling*"
    estimated_repo_count: 12
    primary_language: C#
    key_repos:
      - name: sb-betting-couponplacement
        description: Core coupon/bet placement service
        language: C#
      - name: sb-betting-couponplacement-betupdater
        description: Persists bet updates from coupon placement to the SB database
        language: C#
      - name: sb-betting-couponmanagement
        description: Coupon management service
        language: C#
      - name: sb-betting-couponmanagement-database
        description: Coupon management database (PostgreSQL)
        language: PLpgSQL
      - name: sb-betting-couponpayout
        description: Coupon payout/settlement service
        language: C#
      - name: sb-betting-betpayout
        description: Bet payout processing
        language: C#
      - name: sb-betting-settlingeventapi
        description: Settling event API
        language: C#
      - name: sb-betting-walletadapter
        description: Adapter bridging betting services to the wallet domain
        language: C#
      - name: sb-betting-walletrollback
        description: Wallet rollback handling for failed bets
        language: C#
      - name: sb-betting-legacyupdateservice
        description: Legacy bet update service
        language: C#

