      Cash-out sub-domain — allows customers to settle bets early,
      including the core service and the BetTracer cash-out push channel.
    name_patterns:
      - "sb-betting-cashout"
      - "sb-bettracer2-push-cashout"
    estimated_repo_count: 2
    primary_language: C#
    key_repos:
      - name: sb-betting-cashout
